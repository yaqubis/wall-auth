logging:
  level:
    org.springframework.security: DEBUG
spring:
  application:
    name: WallAuth
    security:
      jwt:
        secret-key: ${JWT_SECRET}
        expiration: 900000
  datasource:
    url: jdbc:postgresql://localhost:5432/int-health-db
    username: ${DB_USR}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8081
  servlet:
    context-path: /wall-auth


