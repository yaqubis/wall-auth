spring:
  application:
    name: WallAuth
  datasource:
    url: jdbc:postgresql://localhost:5432/int-health-db
    username: ${DB_USR}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver

    jpa:
      database-platform: org.hibernate.dialect.PostgreSQLDialect
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
server:
  port: 8081
  servlet:
    context-path: /wall-auth
