name: Aikido Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Aikido CLI
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          # 1. Instala o CLI usando o instalador verificado
          curl -sSL https://raw.githubusercontent.com/aikido-sec/clitool/master/install.sh | bash
          
          # 2. O instalador geralmente coloca o binário em /usr/local/bin ou no diretório atual.
          # Vamos tentar rodar diretamente. Se não estiver no path, tentamos o caminho relativo.
          if command -v aikido-cli &> /dev/null; then
            aikido-cli scan . --api-key $AIKIDO_API_KEY --fail-on critical
          else
            ./aikido-cli scan . --api-key $AIKIDO_API_KEY --fail-on critical
          fi
