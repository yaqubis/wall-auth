name: Aikido Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aikido Scan
        uses: aikido-sec/github-actions@v2
        with:
          # Use o segredo que você já configurou
          api-key: ${{ secrets.AIKIDO_API_KEY }}
          # Falha o build se encontrar vulnerabilidades críticas
          fail-on-priority: 'critical'
