name: Aikido Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aikido Scan via Docker
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          docker run -v $(pwd):/src \
          -e AIKIDO_API_KEY=$AIKIDO_API_KEY \
          aikidosec/aikido-cli \
          scan /src --fail-on critical
