name: Aikido Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aikido Scan via Docker
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_KEY }}
        run: |
          # Usando a imagem oficial 'aikido/aikido-cli'
          # O comando 'scan .' analisa o diretório atual mapeado em /data
          docker run --rm \
            -v $(pwd):/data \
            -e AIKIDO_API_KEY=$AIKIDO_API_KEY \
            aikido/aikido-cli \
            scan /data --fail-on critical
