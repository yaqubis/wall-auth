name: Aikido Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  aikido-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Aikido Scan
        # Atualizado para o nome correto do repositório da Action
        uses: aikido-sec/github-actions-workflow-action@v2
        with:
          aikido-api-key: ${{ secrets.AIKIDO_API_KEY }}
          fail-on-priority: 'critical'
